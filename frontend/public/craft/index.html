<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MrW · Theoretical Craft</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="masthead">
    <div class="title"><span class="diamond" aria-hidden="true">◇</span><div><h1 data-i18n="title"></h1><p data-i18n="subtitle"></p></div></div>
    <div class="header-actions"><button id="undo" data-i18n="undo" disabled></button><button id="download" data-i18n="save" disabled></button></div>
  </header>
  <main class="workbench" id="workbench" aria-busy="true">
    <aside class="item-column">
      <section class="setup"><h2 data-i18n="item"></h2>
        <div class="item-settings"><div><label for="item-class" data-i18n="itemClass"></label><select id="item-class" disabled></select></div>
          <div id="variant-field"><label for="variant" data-i18n="variant"></label><select id="variant" disabled></select></div></div>
        <div class="item-settings one"><div class="base-picker"><label for="base" data-i18n="base"></label>
          <button id="base" type="button" class="base-button" aria-haspopup="listbox" aria-expanded="false" aria-controls="base-pop" disabled><span id="base-label"></span><i aria-hidden="true">▾</i></button>
          <div id="base-pop" class="base-pop" hidden><input id="base-search" type="search" autocomplete="off" role="combobox" aria-controls="base-list" aria-expanded="true" data-i18n-placeholder="base.search"><ul id="base-list" role="listbox"></ul></div></div></div>
        <div id="socket-field" hidden><div class="item-settings"><div><label for="sockets" data-i18n="sockets"></label><select id="sockets" disabled></select></div></div>
          <div id="socket-slots" class="item-settings socket-slots"></div><p id="rune-hint" class="field-hint"></p></div>
        <div class="item-settings three"><div><label for="ilvl">Item Level</label><input id="ilvl" type="number" min="1" max="100" value="81" disabled></div>
          <div><label for="quality">Quality</label><input id="quality" type="number" min="0" max="20" value="20" disabled></div>
          <div><label for="rarity">Rarity</label><select id="rarity" disabled><option>Normal</option><option>Magic</option><option>Rare</option></select></div></div>
      </section>
      <article id="item-card" class="item-card Normal" data-i18n-aria-label="item.aria">
        <div class="item-heading"><span id="rarity-label">Normal</span><h2 id="item-name"></h2><p id="item-class-label" class="item-class-label"></p></div>
        <div id="item-props" class="item-props"></div>
        <div id="item-runes" class="item-runes"></div>
        <div class="slot-summary"><span>Prefix <b id="prefix-count">0 / 0</b></span><span id="crafted-summary">Crafted <b id="crafted-count">0 / 1</b></span><span>Suffix <b id="suffix-count">0 / 0</b></span></div>
        <div id="item-mods"><p class="empty-item" data-i18n="loading"></p></div>
        <div class="item-tools"><button id="clear" data-i18n="clear" disabled></button><button id="reset" data-i18n="reset" disabled></button></div>
      </article>
      <p class="hint" data-i18n="hint.rarity"></p>
      <section class="history"><h2 data-i18n="cost.title"></h2><p id="cost-total">0 Exalted</p><p id="cost-rate" class="hint"></p><p id="price-info" class="hint"></p><ul id="cost-breakdown"></ul><p class="hint" data-i18n="cost.hint"></p></section>
      <section class="history"><h2 data-i18n="history.title"></h2><ol id="history"></ol></section>
    </aside>
    <div class="craft-column">
      <section class="currency-section"><div class="section-head"><h2 data-i18n="currency.title"></h2><span data-i18n="currency.lead"></span></div>
        <div id="currencies" class="currency-list"></div>
        <div id="basic-controls">
        <div id="orb-omens" class="omen-options"></div>
        <div class="apply-row"><div><strong id="selected-name">Orb of Transmutation</strong><p id="selected-detail" data-i18n="loadingShort"></p></div><button id="apply" class="primary" data-i18n="apply" disabled></button></div>
        </div>
        <div id="special-controls" hidden>
        <div class="filters"><div id="special-field"><label for="special" data-i18n="special.material"></label><select id="special" disabled></select></div><div><label for="special-price" data-i18n="special.price"></label><input id="special-price" type="number" min="0" step="any" disabled></div></div>
        <div id="essence-grid" class="essence-grid" hidden></div>
        <div id="special-omens" class="omen-options"></div>
        <div class="apply-row"><div class="special-selection"><img id="special-icon" width="40" height="40" alt=""><div><strong id="special-name"></strong><p id="special-detail"></p></div></div><button id="special-apply" class="primary" data-i18n="special.apply" disabled></button></div>
        <p id="desecrate-note" class="pool-note" data-i18n="desecrate.note"></p>
        </div>
        <div id="reveal-choices" class="reveal-choices"></div>
        <div id="status" role="status" aria-live="polite"></div>
      </section>
      <section class="sim-section" id="sim-section"><div class="section-head"><h2 data-i18n="sim.title"></h2><span data-i18n="sim.lead"></span></div>
        <div class="sim-body">
          <div id="sim-target" class="sim-target"></div>
          <div class="filters sim-controls"><div><label for="sim-orb" data-i18n="sim.orb"></label><select id="sim-orb"></select></div>
            <div><label for="sim-runs" data-i18n="sim.runs"></label><select id="sim-runs"><option value="1000">1.000</option><option value="10000" selected>10.000</option><option value="100000">100.000</option></select></div>
            <div><label for="sim-speed" data-i18n="sim.speed"></label><select id="sim-speed"><option value="5" data-i18n="sim.speed.slow"></option><option value="20" data-i18n="sim.speed.normal" selected></option><option value="100" data-i18n="sim.speed.fast"></option><option value="600" data-i18n="sim.speed.max"></option></select></div></div>
          <div id="sim-omens" class="omen-options"></div>
          <p id="sim-reason" class="sim-reason"></p>
          <div class="sim-actions"><button id="sim-run" class="primary" data-i18n="sim.run" disabled></button><button id="sim-watch" data-i18n="sim.watch" disabled></button><button id="sim-stop" data-i18n="sim.stop" hidden></button><span id="sim-progress" class="hint" aria-live="polite"></span></div>
          <div id="sim-pending" class="sim-pending" hidden><p id="sim-pending-text"></p><div><button id="sim-keep" class="primary" data-i18n="sim.keep"></button><button id="sim-revert" data-i18n="sim.revert"></button></div></div>
          <div id="sim-result" class="sim-result" hidden></div>
          <p class="hint" data-i18n="sim.note"></p>
        </div>
      </section>
      <section class="mod-section"><div class="section-head"><h2 data-i18n="design.title"></h2><span data-i18n="design.lead"></span></div>
        <div class="filters"><div class="search-field"><label for="search" data-i18n="search"></label><input id="search" type="search" data-i18n-placeholder="search.placeholder" disabled></div><div><label for="pool" data-i18n="pool"></label><select id="pool" disabled><option value="normal" data-i18n="pool.normal"></option><option value="desecrated">Desecrated</option><option value="essence">Essence</option><option value="perfect_essence">Perfect Essence</option></select></div></div>
        <p class="pool-note" data-i18n="design.note"></p>
        <p id="pool-hint" class="pool-note" hidden></p>
        <div class="affix-columns"><section><div class="affix-head"><h3>Prefix</h3><span id="prefix-total"></span></div><div id="prefix-list"></div></section><section><div class="affix-head"><h3>Suffix</h3><span id="suffix-total"></span></div><div id="suffix-list"></div></section></div>
      </section>
      <section class="next-step"><div><strong data-i18n="price.title"></strong><p data-i18n="price.lead"></p></div><button id="price-check" data-i18n="price.check" disabled></button></section>
    </div>
  </main>
  <footer><span id="source-info"></span><a id="source-link" href="https://poe2db.tw/us/Gloves_str#ModifiersCalc" target="_blank" rel="noreferrer" data-i18n="source.open"></a></footer>
  <script type="module" src="app.mjs"></script>
</body>
</html>
